server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API: the dashboard calls /api/... and nginx forwards to the API
    # replicas. Resolving "api" through Docker's DNS on every request (re-checked
    # every 5s), instead of once at startup, means nginx follows replicas as they
    # are scaled, killed or restarted -- Docker DNS round-robins across them.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;

    location ~ ^/(api|metrics|healthz|readyz|docs|openapi.json) {
        proxy_pass $api_upstream;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
